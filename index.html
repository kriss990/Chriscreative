    <style>
        body {
            box-sizing: border-box;
        }
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            animation: gradientShift 8s ease-in-out infinite;
        }
        
        @keyframes gradientShift {
            0%, 100% { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
            50% { background: linear-gradient(135deg, #764ba2 0%, #667eea 100%); }
        }
        
        .card-hover {
            transition: all 0.3s ease;
            animation: slideInUp 0.6s ease-out;
        }
        .card-hover:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        
        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .profile-avatar {
            animation: bounce 2s infinite, rotate 4s linear infinite;
        }
        
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0) rotate(0deg); }
            40% { transform: translateY(-10px) rotate(5deg); }
            60% { transform: translateY(-5px) rotate(-5deg); }
        }
        
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .fade-in {
            animation: fadeIn 1s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .pulse-glow {
            animation: pulseGlow 2s ease-in-out infinite;
        }
        
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(255,255,255,0.3); }
            50% { box-shadow: 0 0 30px rgba(255,255,255,0.6); }
        }
        
        .prompt-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            animation: slideInLeft 0.8s ease-out;
            transition: all 0.3s ease;
        }
        
        .prompt-card:hover {
            transform: translateX(10px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }
        
        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        .floating {
            animation: floating 3s ease-in-out infinite;
        }
        
        @keyframes floating {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        
        .shake-on-hover:hover {
            animation: shake 0.5s ease-in-out;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        
        .modal-slide-in {
            animation: modalSlideIn 0.3s ease-out;
        }
        
        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: scale(0.8) translateY(-50px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        
        .notification-slide {
            animation: notificationSlide 0.5s ease-out;
        }
        
        @keyframes notificationSlide {
            from {
                opacity: 0;
                transform: translateX(100px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        .stagger-animation {
            animation-delay: var(--delay);
        }
    </style>
</head>

                promptCard.className = 'prompt-card';
                promptCard.innerHTML = `
                    <div class="mb-4">
                        ${prompt.image}
                    </div>
                    <h3 class="font-bold text-lg mb-1">${prompt.website}</h3>
                    <p class="text-sm text-gray-600 mb-2">Model: ${prompt.model}</p>
                    <p class="text-sm text-green-600 font-medium mb-2">${prompt.result}</p>
                    <p class="text-sm font-medium mb-2">${prompt.instruction}</p>
                    <div class="bg-gray-100 p-3 rounded-lg mb-3">
                        <p class="text-sm">${prompt.prompt}</p>
                    </div>
                    <button onclick="copyPrompt('${prompt.prompt.replace(/'/g, "\\\'")}')" 
                            class="bg-blue-500 text-white px-4 py-2 rounded text-sm hover:bg-blue-600 transition-colors">
                        Copy Prompt
                    </button>
                `;
                promptsList.appendChild(promptCard);
            });
        }

        function copyPrompt(text) {
            navigator.clipboard.writeText(text).then(() => {
                const notification = document.createElement('div');
                notification.className = 'fixed top-4 right-4 bg-green-500 text-white p-3 rounded-lg z-50 notification-slide';
                notification.textContent = 'Prompt berhasil disalin!';
                document.body.appendChild(notification);
                
                setTimeout(() => {
                    document.body.removeChild(notification);
                }, 2000);
            });
        }
    </script>
